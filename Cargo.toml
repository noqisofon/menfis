[package]
name = "menfis"
version = "0.1.0"
edition = "2021"
description = "軽快に動くデスクトップテキストエディタ"
license = "MIT"

[dependencies]
winit = "0.30"
wgpu = "22"
pollster = "0.3"
env_logger = "0.11"
log = "0.4"
glyphon = "0.6"
ropey = "1.6.1"
bytemuck = { version = "1.25.2", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
